name: 更新 2330 收盤價

on:
  schedule:
    # 台北時間週一到週五 14:20 與 16:20（UTC+8 → UTC 06:20、08:20）
    - cron: "20 6 * * 1-5"
    - cron: "20 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓收盤價
        run: python scripts/fetch_price.py
      - name: 有變動才提交
        run: |
          if git diff --quiet -- data/; then
            echo "價格沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "更新 2330 收盤價 $(python -c 'import json;d=json.load(open("data/2330.json"));print(d["date"], d["close"])')"
          git push
